<div class="body mt-4 ms-4">
    <span class="">Stock Upload Mapping</span>

</div>
                <!-- <div class="row col-9 justify-end d-flex !m-0">
                    <span class="!mb-4 btn-view cursor-pointer" >View Mapping</span>
                </div> -->
                <form [formGroup]="stMappingForm">
                <div class="d-flex !justify-center mt-3">
                    <div class="  w-[100vh]  card !flex !flex-col !gap-6 !justify-center !items-center">
                        <p-select [options]="brands"  formControlName="brands"
                         optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                        <div class="row w-full">
                            <div class="col d-flex justify-evenly mb-4">
                                <span class="btn-view cursor-pointer">View Mapping</span>
                                <span class="btn-view cursor-pointer">Submit</span>
                            </div>

                        </div>
                      
                    </div>
                </div>
                <div class="d-flex !justify-evenly mt-4">
                    <div >
                        <input type="checkbox" class="cursor-pointer w-4 h-4 " formControlName="mappingForBothStock" />
                        <span  class="f-15 !ms-2" >Is Mapping Different for Current & Older Days Stock?</span>
                    </div>

                </div>
<div class="!flex !justify-center mt-4">
                <div class="w-[100vh] card !flex !flex-col !gap-6 p-3">
                    <div class="d-flex flex-row">
                        <span>Add Mapping for Current Days Stock Upload :  </span>
                        <p-fileupload #fu class=" ms-2 me-5 " mode="basic" chooseLabel="Choose" 
                         chooseIcon="pi pi-upload" name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php" accept=".xlsx,.csv,.xls" (onUpload)="onUpload($event)" />
               
                         <div class="d-flex justify-end">

                             <p-button label="Upload" class="btn-upload" (onClick)="fu.upload()" severity="secondary" class="pb-3" />
                         </div>
                    

                    </div>
                    <div class="card mapping-card d-flex justify-center">
                        <div class="row ">
                            <div class="col-12">
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Part Number:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                                
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Stock Quantity:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Stock Quantity:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="d-flex flex-row">
                        <span>Add Mapping for Older Days Stock Upload :  </span>
                        <p-fileupload #fu class=" ms-2 me-5 " mode="basic" chooseLabel="Choose" 
                         chooseIcon="pi pi-upload" name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php" accept=".xlsx,.csv,.xls" (onUpload)="onUpload($event)" />
               
                         <div class="d-flex justify-end">

                            <p-button label="Upload" class="btn-upload" (onClick)="fu.upload()" severity="secondary" class="pb-3" />
                        </div>

                    </div>
                    <div class="card mapping-card d-flex justify-center">
                        <div class="row ">
                            <div class="col-12">
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Part Number:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                                
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Stock Quantity:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                                <div class="row ">
                                    <div class="col-6 d-flex justify-center align-items-center">
                                        <span>Stock Quantity:</span>
                                    </div>
                                    <div class="col-6">
                                        <p-select [options]="brands"  formControlName="brands"
                                        optionLabel="name" placeholder="Select Brand" class="!mt-3 w-56 md:w-56" />
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="!d-flex !justify-center !align-center w-full">
                        <span class="btn-view">Submit</span>
                    </div>
                </div>
            </div>
            </form>
